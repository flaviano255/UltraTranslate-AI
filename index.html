<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UltraTranslate AI Premium</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 min-height:100vh;
 font-family:Arial,sans-serif;
 background:linear-gradient(135deg,#0f172a,#1e3a8a,#312e81);
 color:white;
 display:flex;
 justify-content:center;
 align-items:center;
}
.app{
 width:95%;
 max-width:1100px;
 background:rgba(255,255,255,.12);
 backdrop-filter:blur(18px);
 border:1px solid rgba(255,255,255,.2);
 border-radius:32px;
 padding:35px;
 box-shadow:0 30px 80px #0005;
}
.top{
 display:flex;
 justify-content:space-between;
 align-items:center;
}
.logo{font-size:42px}
.mode{
 background:white;
 color:#111827;
 padding:10px 15px;
 border-radius:20px;
 cursor:pointer;
}
h1{
 font-size:42px;
 text-align:center;
 margin:10px;
}
.subtitle{
 text-align:center;
 opacity:.8;
}
.languages{
 display:flex;
 justify-content:center;
 gap:15px;
 margin:30px 0;
 flex-wrap:wrap;
}
select,button{
 padding:14px 20px;
 border-radius:18px;
 border:none;
 font-size:16px;
}
select{
 background:white;
}
.swap{
 background:#38bdf8;
 color:white;
 cursor:pointer;
}
.boxes{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:20px;
}
.card{
 background:white;
 color:#111827;
 padding:20px;
 border-radius:25px;
}
textarea{
 width:100%;
 height:220px;
 border:none;
 outline:none;
 resize:none;
 background:#f1f5f9;
 border-radius:18px;
 padding:15px;
 font-size:17px;
}
.translate{
 display:block;
 margin:25px auto;
 background:linear-gradient(90deg,#22c55e,#06b6d4);
 color:white;
 font-weight:bold;
 cursor:pointer;
}
.features{
 display:flex;
 gap:12px;
 justify-content:center;
 flex-wrap:wrap;
}
.tag{
 background:rgba(255,255,255,.15);
 padding:12px 18px;
 border-radius:50px;
}
@media(max-width:700px){
.boxes{grid-template-columns:1fr}
h1{font-size:30px}
}
</style>
</head>
<body>

<div class="app">

<div class="top">
<div class="logo">🌎🤖</div>
<div class="mode">🌙 Mode</div>
</div>

<h1>UltraTranslate AI</h1>
<p class="subtitle">Your next generation AI translation assistant</p>

<div class="languages">
<select>
<option>Detect Language</option>
<option>English</option>
<option>Tagalog</option>
<option>Japanese</option>
<option>Spanish</option>
<option>Chinese</option>
</select>

<button class="swap">⇄</button>

<select>
<option>Tagalog</option>
<option>English</option>
<option>Japanese</option>
<option>Spanish</option>
<option>Chinese</option>
</select>
</div>

<div class="boxes">
<div class="card">
<h3>Input</h3>
<textarea placeholder="Type your message..."></textarea>
</div>

<div class="card">
<h3>AI Translation</h3>
<textarea placeholder="Translation result..." readonly></textarea>
</div>
</div>

<button class="translate">✨ Translate with AI</button>

<div class="features">
<div class="tag">🧠 Context AI</div>
<div class="tag">⚡ Fast Engine</div>
<div class="tag">🎤 Voice Ready</div>
<div class="tag">📷 Camera Ready</div>
</div>

</div>


<script>
const inputBox = document.querySelectorAll("textarea")[0];
const outputBox = document.querySelectorAll("textarea")[1];
const translateBtn = document.querySelector(".translate");
const fromLang = document.querySelectorAll("select")[0];
const toLang = document.querySelectorAll("select")[1];
const swapBtn = document.querySelector(".swap");

const langCodes = {
  "English":"en",
  "Tagalog":"tl",
  "Japanese":"ja",
  "Spanish":"es",
  "Chinese":"zh-CN",
  "Korean":"ko",
  "French":"fr",
  "German":"de"
};

async function translateText(){
  const text = inputBox.value.trim();

  if(!text){
    outputBox.value = "Please type something to translate.";
    return;
  }

  outputBox.value = "Translating...";

  try{
    const source = fromLang.value === "Detect Language" ? "auto" : langCodes[fromLang.value];
    const target = langCodes[toLang.value];

    const res = await fetch("https://libretranslate.com/translate", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        q: text,
        source: source,
        target: target,
        format: "text"
      })
    });

    if(!res.ok) throw new Error("Translation failed");

    const data = await res.json();
    outputBox.value = data.translatedText || "No translation found.";

  }catch(e){
    outputBox.value = "Translation service unavailable. Try again later.";
  }
}

translateBtn.onclick = translateText;

swapBtn.onclick = ()=>{
  let a = fromLang.value;
  fromLang.value = toLang.value;
  toLang.value = a;

  let b = inputBox.value;
  inputBox.value = outputBox.value;
  outputBox.value = b;
};
</script>

</body>
</html>
